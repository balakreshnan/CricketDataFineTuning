# Cricket environment for NeMo RL training (NeMo Gym version pinned by NeMo RL). Layout follows resources_servers/mcqa.
cricket_qa:
  resources_servers:
    cricket_qa:
      entrypoint: app.py
      domain: other
      verified: false
      description: T20 cricket rate and milestone questions with exact numeric answers
      len_coef: 0.4            # same length term as rhea/rlvr.py --len_coef 0.4
      max_output_tokens: 4096

cricket_qa_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: cricket_qa
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/cricket_qa/data/train.jsonl
        license: Apache 2.0
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/cricket_qa/data/validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/cricket_qa/data/example.jsonl

cricket_qa_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: cricket_qa
      agent_server:
        type: responses_api_agents
        name: cricket_qa_simple_agent
